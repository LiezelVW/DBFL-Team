<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBFL | Our Team Concept</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--o:#f15a29;--ink:#171717;--grey:#666;--line:#e7e7e7}*{box-sizing:border-box}body{margin:0;font-family:Montserrat,Arial,sans-serif;color:var(--ink);background:#fff}.top{height:92px;padding:0 6vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:20}.logo{font-size:34px;font-weight:800;letter-spacing:-2px;color:var(--o)}.logo small{display:block;color:#555;font-size:7px;letter-spacing:1.8px;margin-top:-3px}.brand-logo{width:190px;height:auto;display:block;object-fit:contain}.footer-logo{width:165px;height:auto;display:block;object-fit:contain}.nav{display:flex;gap:30px;font-size:12px;font-weight:600}.nav span{cursor:default}.hero{padding:82px 6vw 72px;background:linear-gradient(120deg,#fff 65%,#f7f7f5)}.kicker{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--o);text-transform:uppercase}.hero-grid{display:grid;grid-template-columns:1.05fr .75fr;gap:9vw;align-items:end;margin-top:18px}.hero h1{font-size:clamp(55px,8vw,112px);line-height:.9;letter-spacing:-5px;margin:0}.hero h1 b{color:var(--o)}.hero p{font-size:15px;line-height:1.85;color:#4c5053;margin:0}.team{padding:68px 6vw 110px}.heading{display:flex;align-items:end;gap:26px;margin-bottom:38px}.heading h2{font-size:clamp(34px,4vw,52px);letter-spacing:-2px;margin:7px 0 0}.rule{height:1px;background:#ddd;flex:1;margin-bottom:9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}.card{position:relative;aspect-ratio:1/1.08;overflow:hidden;background:#ddd;cursor:pointer;outline:none}.photo{width:100%;height:100%;object-fit:cover;display:block;transition:.5s transform,.35s filter}.shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.8));z-index:1}.bar{position:absolute;left:0;bottom:0;width:7px;height:22%;background:var(--o);z-index:5;transition:.4s height}.base{position:absolute;left:26px;right:22px;bottom:22px;color:#fff;z-index:3;transition:.3s}.base h3{font-size:23px;letter-spacing:-.8px;margin:0 0 6px}.base div{font-size:11px;font-weight:600}.panel{position:absolute;z-index:4;left:0;right:0;bottom:0;height:100%;padding:34px 30px 28px 32px;background:rgba(255,255,255,.72);backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);transform:translateY(102%);transition:.48s cubic-bezier(.2,.75,.2,1) transform}.panel h3{font-size:20px;letter-spacing:-.6px;margin:0}.discipline{font-size:10px;font-weight:800;color:var(--o);text-transform:uppercase;letter-spacing:1.3px;margin:6px 0 15px}.copy{font-size:11.6px;line-height:1.58;max-height:calc(100% - 58px);overflow:auto;padding-right:6px}.card:hover .panel,.card:focus .panel,.card.open .panel{transform:translateY(0)}.card:hover .base,.card:focus .base,.card.open .base{opacity:0}.card:hover .photo,.card:focus .photo,.card.open .photo{transform:scale(1.04);filter:brightness(.86)}.card:hover .bar,.card:focus .bar,.card.open .bar{height:100%}.footer{background:#171717;color:#fff;padding:38px 6vw;display:flex;justify-content:space-between;align-items:center}.footer .logo{font-size:28px}.footer p{font-size:10px;color:#aaa;letter-spacing:.7px}@media(max-width:980px){.nav{display:none}.hero-grid{grid-template-columns:1fr;gap:30px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.top{height:72px;padding:0 20px}.hero,.team{padding-left:20px;padding-right:20px}.hero h1{font-size:58px;letter-spacing:-3px}.grid{grid-template-columns:1fr}.panel{height:100%}.heading{display:block}.rule{margin-top:20px}.footer{padding:30px 20px}}
.contact-links{display:flex;gap:12px;align-items:center;margin:12px 0 2px}.contact-links a{color:#f15a29;font:bold 20px Arial,sans-serif;text-decoration:none}.contact-links a:hover{color:#b83e19}.panel{overflow-y:auto}.panel .copy{max-height:none;overflow:visible}.project-links{display:block;margin-top:16px;padding-bottom:12px}.project-links h4{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#f15a29;margin:0 0 8px}.project-links a{display:block;color:#333;font-size:11px;font-weight:600;line-height:1.4;padding:7px 0;border-bottom:1px solid #e6e6e6;text-decoration:none}.project-links a:hover{color:#f15a29}
.integration-note{padding:20px 6vw;background:#f7f8f8;color:#45555f;font-size:12px;line-height:1.8}.integration-note strong{color:#f15a29}.team{max-width:1600px;margin:0 auto}@media(prefers-reduced-motion:reduce){.photo,.panel,.bar,.base{transition:none!important}}.dbfl-live-header{height:375px;position:relative;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,.04)),url('https://www.dbfl.ie/wp-content/uploads/2024/06/DBFL-Jersey-Day.jpg') center 45%/cover #45555f;color:white}.dbfl-live-nav{height:79px;background:rgba(241,90,41,.85);display:flex;align-items:center;justify-content:space-between;padding:0 max(6vw,calc((100vw - 1300px)/2));font-size:14px;font-weight:700}.dbfl-live-nav img{width:180px;max-height:60px;object-fit:contain}.dbfl-live-hero-title{max-width:1100px;margin:54px auto 0;padding:0 25px;font-size:24px;text-shadow:0 1px 8px #222}.dbfl-live-hero-title h1{font-size:48px;line-height:1.1;letter-spacing:-1px;margin:14px 0;font-weight:800}.dbfl-breadcrumb{max-width:1300px;margin:25px auto 0;padding:0 25px;color:#45555f;font-size:15px;font-weight:700}.dbfl-intro{max-width:940px;margin:85px auto 95px;padding:0 25px}.dbfl-intro p{font-size:16px;font-weight:700;line-height:1.48;color:#151515}.dbfl-buttons{display:flex;justify-content:center;gap:12px;margin-top:95px}.dbfl-buttons a{display:inline-block;background:#f15a29;color:white;text-decoration:none;font-size:14px;font-weight:700;padding:15px 45px;border-radius:0 55px 0 55px}.dbfl-buttons a.outline{background:white;color:#f15a29;border:1px solid #f15a29}.integration-note{display:none}@media(max-width:650px){.dbfl-live-header{height:320px}.dbfl-live-hero-title{margin-top:55px}.dbfl-live-hero-title h1{font-size:36px}.dbfl-intro{margin:50px auto}.dbfl-buttons{margin-top:45px;flex-wrap:wrap}}</style></head><body><div class="integration-note"><strong>iPlanit integration preview.</strong> The existing DBFL website header, group-photo hero, breadcrumbs, introduction and buttons remain unchanged. Only this team section is proposed for replacement.</div><main><section class="team"><div class="heading"><div><div class="kicker">Leadership</div><h2>Meet our Directors</h2></div><div class="rule"></div></div><div class="grid" id="grid"></div></section></main><script>
const people=[["Bill Bates","Civils","https://www.dbfl.ie/wp-content/uploads/2024/06/Bill-Bates-2-2-300x300.jpg","A Chartered Civil and Structural Engineer with over 35 years of experience. Bill specialises in marine and heavy civil engineering, ports, bridges and complex infrastructure delivery."],["Colm Doyle","Structures","https://www.dbfl.ie/wp-content/uploads/2024/06/Colm-Doyle-Web-Final-2-300x300.jpg","A Chartered Engineer with almost 30 years of experience. Colm specialises in structural design for residential and mixed-use developments, reinforced concrete and complex basement construction."],["Fergal English","Structures","https://www.dbfl.ie/wp-content/uploads/2024/06/Fergal-English-Websize-Final-300x300.jpg","A Chartered Engineer with almost 30 years of experience in structural design and delivery. Fergal works across commercial, residential, retail and civic developments."],["Noel Gorman","Civils","https://www.dbfl.ie/wp-content/uploads/2024/07/Noel-Gorman-1-300x300.jpg","A Chartered Engineer with more than 14 years of experience. Noel specialises in civil infrastructure, roads, active travel, drainage and multidisciplinary design coordination."],["John Hayes","Structures (Chairman)","https://www.dbfl.ie/wp-content/uploads/2024/06/John-Hayes-Web-Final-1-300x300.jpg","DBFL's Chairman and a Chartered Engineer with over 35 years of experience. John provides strategic direction and technical oversight across civil and structural engineering."],["Thomas Jennings","Transportation","https://www.dbfl.ie/wp-content/uploads/2024/06/Thomas-Jennings-1-300x300.jpg","A Transportation Director with over 25 years of experience. Thomas specialises in traffic engineering, active travel, public transport, mobility strategies and infrastructure design."],["John Keane","Structures","https://www.dbfl.ie/wp-content/uploads/2024/06/John-Keane-Websize-300x300.jpg","A Chartered Engineer with almost four decades of experience. John specialises in complex structural refurbishment, conservation and adaptive reuse of existing buildings."],["Tracy Kearney","Structures","https://www.dbfl.ie/wp-content/uploads/2024/06/Tracy-New-Web-2-300x300.jpg","A Chartered Engineer with over 30 years of experience. Tracy specialises in complex steel and concrete structures, conservation, structural refurbishment and adaptive reuse."],["Robert Kelly","Transportation","https://www.dbfl.ie/wp-content/uploads/2024/06/Rob-Kelly-Web-Final-2-300x300.jpg","A Chartered Engineer with more than 20 years of experience. Robert specialises in active travel, sustainable mobility, public realm, transport planning and stakeholder engagement."],["Dan Reilly","Managing Director","https://www.dbfl.ie/wp-content/uploads/2024/06/Dan-Reilly-300x300.jpg","DBFL's Managing Director and a Chartered Engineer with over 30 years of experience. Dan combines strategic leadership with expertise in infrastructure, transportation, drainage and planning."],["Kevin Sturgeon","Civils","https://www.dbfl.ie/wp-content/uploads/2024/06/Kevin-Sturgeon-3-Web-300x300.jpg","A Chartered Engineer with almost 30 years of experience. Kevin specialises in civil infrastructure, roads, drainage, water services, flood risk and project delivery."],["Neil Wilson","Structures","https://www.dbfl.ie/wp-content/uploads/2024/07/Neil-Wilson-Web-300x300.jpg","A Chartered Engineer with more than 20 years of experience. Neil leads DBFL's structural sustainability work, balancing performance, efficient design, buildability and environmental considerations."]];const directorProjects={"Fergal English":[["Momentum Logistics Park, Naas","momentum-logistics-park-naas"],["Central Plaza","central-plaza"],["Beckett Locke Hotel","beckett-locke-hotel"],["City Quay","city-quay"],["Alto Vetro","alto-vetro"]],"John Hayes":[["Lufthansa","lufthansa"],["Kilcarbery Residential Development","kilcarbery-residential-development"],["Herbert Hill","herbert-hill"],["Townsend Street Renewal","townsend-street"],["Ardgillan Community College","ardgillian-commuinty-college"]],"Bill Bates":[["Weaver Park","weaver-park-cork-st-dublin"],["Dublin Inland Port","dublin-inland-port"],["Berth 50 Pontoons","berth-50-pontoons"],["RO RO Jetty at Dublin Port","ro-ro-jetty-at-dublin-port"],["Dublin Port Traffic Studies","dublin-port-traffic-studies"]],"Colm Doyle":[["Criminal Courts of Justice","criminal-courts-of-justice"],["National Concert Hall","national-concert-hall"],["Garda National Support Services Headquarters","garda-national-support-services-headquarters"],["Leopardstown Aged Care Facility","leopardstown-aged-care-facility"]],"Kevin Sturgeon":[["Ballyhale Flood Relief Scheme","ballyhale-flood-relief-scheme"],["Bridge at Mariavilla, Maynooth","bridge-at-mariavilla-maynooth-dunmore-road-r683-green-route"],["Hansfield Station Access Road","hansfield-station-access-road"]],"Thomas Jennings":[["Cork Road R680 Green Route","cork-road-r680-green-route-waterford"],["Tramore Mobility and Public Realm Strategy","tramore-mobility-and-public-realm-strategy"]],"Dan Reilly":[["Primark Regional Distribution Centre","primark-regional-distribution-centre-great-connell"],["SuDS Case Study – Clonburris","suds-case-study-clonburris"],["Oscar Traynor Road","oscar-traynor-road"]]};const directorContacts={"Bill Bates":["bill.bates@dbfl.ie","https://www.linkedin.com/in/bill-bates-a8143a63/"],"Colm Doyle":["colm.doyle@dbfl.ie","https://www.linkedin.com/in/colm-doyle-82a4101b/"],"Fergal English":["fergal.english@dbfl.ie","https://www.linkedin.com/in/fergalenglishwaterfordfergal-english-56a1b217/"],"Noel Gorman":["noel.gorman@dbfl.ie","https://www.linkedin.com/in/noel-gorman-91895047/"],"John Hayes":["john.hayes@dbfl.ie","https://www.linkedin.com/in/john-hayes-73368a19/"],"Thomas Jennings":["thomas.jennings@dbfl.ie","https://www.linkedin.com/in/thomas-noel-jennings-036a2a57/"],"John Keane":["john.keane@dbfl.ie","https://www.linkedin.com/in/john-keane-113a30119/"],"Tracy Kearney":["Tracy.Kearney@dbfl.ie","https://www.linkedin.com/in/tracy-kearney-6217541a/"],"Robert Kelly":["robert.kelly@dbfl.ie","https://www.linkedin.com/in/robert-kelly-73707265/"],"Dan Reilly":["dan.reilly@dbfl.ie","https://www.linkedin.com/in/dan-reilly-19316215/"],"Kevin Sturgeon":["kevin.sturgeon@dbfl.ie","https://www.linkedin.com/in/kevin-sturgeon-14b2302a/"],"Neil Wilson":["neil.wilson@dbfl.ie","https://www.linkedin.com/in/neil-wilson-c-eng/"]};const grid=document.getElementById("grid");grid.innerHTML=people.map((p,i)=>'<article class="card" tabindex="0" data-i="'+i+'"><img class="photo" src="'+p[2]+'" alt="'+p[0]+'"><div class="shade"></div><div class="bar"></div><div class="base"><h3>'+p[0]+'</h3><div>'+p[1]+'</div></div><div class="panel"><h3>'+p[0]+'</h3><div class="discipline">'+p[1]+'</div><div class="copy">'+p[3]+'</div>'+(directorContacts[p[0]]?'<div class="contact-links"><a href="mailto:'+directorContacts[p[0]][0]+'" aria-label="Email '+p[0]+'" title="Email">✉</a>'+(directorContacts[p[0]][1]?'<a href="'+directorContacts[p[0]][1]+'" target="_blank" rel="noopener noreferrer" aria-label="'+p[0]+' on LinkedIn" title="LinkedIn">in</a>':'')+'</div>':'')+(directorProjects[p[0]]?.length?'<div class="project-links"><h4>Key Projects Delivered</h4>'+directorProjects[p[0]].map(x=>'<a href="https://www.dbfl.ie/project/'+x[1]+'/" target="_blank" rel="noopener noreferrer">'+x[0]+'</a>').join('')+'</div>':'')+'</div></article>').join("");grid.addEventListener("click",e=>{const c=e.target.closest(".card");if(!c)return;if(e.target.closest(".project-links a, .contact-links a"))return;const was=c.classList.contains("open");document.querySelectorAll(".card.open").forEach(x=>x.classList.remove("open"));if(!was)c.classList.add("open")});
</script></body></html>
